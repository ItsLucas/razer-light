[package]
name = "razer-core"
version.workspace = true
edition.workspace = true

[dependencies]
hidapi = "2.6"
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rand = "0.8"
serde-big-array = "0.5"
strum = { version = "0.26", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

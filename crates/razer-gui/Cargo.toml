[package]
name = "razer-gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rhelper"
path = "src/main.rs"

[dependencies]
razer-core = { path = "../razer-core" }
slint = { version = "1", features = ["unstable-winit-030"] }
tray-icon = "0.21"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
dirs = "6"

[build-dependencies]
slint-build = "1"
